[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mixonaut"
version = "1.0.1"
description = "Outils pour audio (Beets, Essentia, etc.)"
requires-python = ">=3.12"

[tool.setuptools]
packages = ["mixonaut"]

[tool.pylint.'MASTER']
ignore = ["z_old", "docker"]

[tool.isort]
profile = "black"
line_length = 120         # aligne-toi avec Black (par défaut 88)
src_paths = ["mixonaut"] # ton package
known_first_party = ["mixonaut"]

# --- Mypy -------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
pretty = true
show_error_codes = true
ignore_missing_imports = false
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_return_any = true
disallow_untyped_calls = true
disallow_any_generics = true
warn_unused_configs = true
warn_no_return = true
files = ["."]
explicit_package_bases = true
exclude = "^(z_old|docker)/"  # regex unique (mypy attend une regex, pas une liste)

[[tool.mypy.overrides]]
module = "dotenv.*"
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
module = "rich.*"
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
module = "numpy.*"
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
module = "sklearn.*"
ignore_missing_imports = true
follow_imports = "skip"

